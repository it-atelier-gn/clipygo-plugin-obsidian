name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clipygo-plugin-obsidian-windows-x64.exe
            binary: target/x86_64-pc-windows-msvc/release/clipygo-plugin-obsidian.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: clipygo-plugin-obsidian-linux-x64
            binary: target/x86_64-unknown-linux-gnu/release/clipygo-plugin-obsidian

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: clipygo-plugin-obsidian-macos-arm64
            binary: target/aarch64-apple-darwin/release/clipygo-plugin-obsidian

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: cp ${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Compute SHA256
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact }} | awk '{print $1}' > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} | awk '{print $1}' > ${{ matrix.artifact }}.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/clipygo-plugin-obsidian-windows-x64.exe
            artifacts/clipygo-plugin-obsidian-windows-x64.exe.sha256
            artifacts/clipygo-plugin-obsidian-linux-x64
            artifacts/clipygo-plugin-obsidian-linux-x64.sha256
            artifacts/clipygo-plugin-obsidian-macos-arm64
            artifacts/clipygo-plugin-obsidian-macos-arm64.sha256
          generate_release_notes: true
